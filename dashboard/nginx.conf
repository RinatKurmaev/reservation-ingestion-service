# Scenario dashboard: static demo UI + same-origin API proxy.
#
# The page is pure static HTML and the API calls are proxied under /api/, so
# the browser never crosses ports or origins (no CORS needed) and the page
# itself is reachable even when the API container is stopped.
server {
    listen 80;

    # Static scenario dashboard (index.html).
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # API proxy: /api/<path> -> http://api:8000/<path> (trailing slash strips
    # the /api prefix). Must resolve the compose service name "api".
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Long scenario runs poll for minutes; no buffering surprises.
        proxy_buffering off;
    }
}
