name: reservation-ingestion

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: reservations
      POSTGRES_PASSWORD: reservations
      POSTGRES_DB: reservations
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations -d reservations"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: docker.io/library/rabbitmq:3.13-management-alpine
    # FIXED hostname: RabbitMQ's node name is rabbit@<hostname> and its data
    # lives in mnesia/rabbit@<hostname> inside the volume. Without this,
    # podman-compose container recreations change the hash hostname -> the node
    # boots with an EMPTY store ("Recovering 0 queues") and silently loses all
    # durable queue definitions AND messages despite the volume.
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: &app_env
      DATABASE_URL: postgresql+asyncpg://reservations:reservations@db:5432/reservations
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.consumer"]
    environment: *app_env
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    # NOTE: deliberately NO depends_on on db. podman-compose turns depends_on
    # into podman-level container dependencies (--requires), and then ANY
    # `podman start worker` silently starts the db too — which would make the
    # full-DB-outage demo impossible (the worker must be started while the DB
    # is down). The worker tolerates a missing DB at boot: init_db retries for
    # ~30s and messages nack into the retry queue (SCENARIOS.md §4.2).

  # Scenario dashboard: static demo UI in its own container, decoupled from the
  # API process. nginx serves the page and proxies /api/ -> api:8000, so the
  # browser stays same-origin (no CORS) and the page still loads when the API
  # (or the whole system) is down — it then just shows everything unreachable.
  dashboard:
    image: docker.io/library/nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dashboard/index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmq_data:
